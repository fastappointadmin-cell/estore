server:
  port: ${PORT:8080}

spring:
  application:
    name: estore
  datasource:
    # Local default; on Railway, either SPRING_DATASOURCE_URL or the PG* vars from the PostgreSQL addon are used.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:lavander}}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:parola123}
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: ${SPRING_JPA_SHOW_SQL:false}

# Local defaults below are insecure placeholders. On Railway, set JWT_SECRET,
# ADMIN_EMAIL, and ADMIN_PASSWORD as real environment variables.
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-this-on-railway-32-bytes-min}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}

app:
  admin:
    email: ${ADMIN_EMAIL:admin@lavander.local}
    password: ${ADMIN_PASSWORD:admin123}